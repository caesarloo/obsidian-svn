name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Attest main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/main.js

      - name: Attest manifest.json
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/manifest.json

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          generate_release_notes: false
          fail_on_unmatched_files: true
          make_latest: true
